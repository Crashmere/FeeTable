# 放在共享 Nginx server 内；仅负责 /feetable，不接管其他应用。
location = /feetable {
    return 308 /feetable/$is_args$args;
}
location ^~ /feetable/ {
    # iOS may fetch home-screen artwork without the browser's device cookie.
    # Only these public branding files bypass authentication; never allow all assets.
    location ~ ^/feetable/assets/(?:icon-32-[A-Za-z0-9_-]+\.png|icon-[A-Za-z0-9_-]+\.svg|apple-touch-icon-[A-Za-z0-9_-]+\.png)$ {
        auth_request off;
        limit_except GET { deny all; }
        rewrite ^/feetable/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18081;
    }

    # 末尾 / 去掉外部前缀，Go 仍接收 /api、/assets 和页面路由。
    proxy_pass http://127.0.0.1:18081/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_next_upstream off;
    proxy_redirect off;
}
